name: Deploy to Firebase Hosting (Service Account)

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Prepare service account
        env:
          FIREBASE_SA_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SA_BASE64" ]; then echo "Missing FIREBASE_SERVICE_ACCOUNT secret"; exit 1; fi
          echo "$FIREBASE_SA_BASE64" | base64 --decode > /tmp/firebase-sa.json
          echo "Wrote service account to /tmp/firebase-sa.json"

      - name: Install Firebase Tools
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Hosting
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase-sa.json
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          # derive project id from .firebaserc so it stays in sync with the repo
          if [ -f .firebaserc ]; then
            PROJECT_ID=$(node -e "console.log(require('./.firebaserc').projects.default || '')")
          fi
          if [ -z "$PROJECT_ID" ]; then
            echo "Could not read project id from .firebaserc; falling back to neat-fsmcrm"
            PROJECT_ID=neat-fsmcrm
          fi
          echo "Deploying to Firebase project: $PROJECT_ID"

          # Prefer service account file if present (created earlier), otherwise fallback to token
          if [ -f /tmp/firebase-sa.json ]; then
            echo "Found service account file; using service account for auth"
            firebase deploy --only hosting --project "$PROJECT_ID"
          elif [ -n "$FIREBASE_TOKEN" ]; then
            echo "Service account not found; using FIREBASE_TOKEN secret for auth"
            firebase deploy --only hosting --project "$PROJECT_ID" --token "$FIREBASE_TOKEN"
          else
            echo "ERROR: Neither FIREBASE_SERVICE_ACCOUNT nor FIREBASE_TOKEN is set in repository secrets."
            echo "Add FIREBASE_SERVICE_ACCOUNT (base64-encoded service account JSON) or FIREBASE_TOKEN (firebase login:ci token)."
            exit 1
          fi
