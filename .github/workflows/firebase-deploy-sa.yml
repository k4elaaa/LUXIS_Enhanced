name: Deploy to Firebase Hosting (Service Account)

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Prepare service account
        env:
          FIREBASE_SA_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SA_BASE64" ]; then echo "Missing FIREBASE_SERVICE_ACCOUNT secret"; exit 1; fi
          echo "$FIREBASE_SA_BASE64" | base64 --decode > /tmp/firebase-sa.json
          echo "Wrote service account to /tmp/firebase-sa.json"

      - name: Install Firebase Tools
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Hosting
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase-sa.json
        run: |
          firebase deploy --only hosting --project neat-fsmcrm
